name: deploy-pages
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main обязателен. По умолчанию checkout берёт SHA, на котором
      # стартовал прогон; при вызове из update-data коммит со свежими данными
      # делается ПОЗЖЕ в том же прогоне, и сайт публиковался бы без него.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
